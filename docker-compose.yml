services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
      POSTGRES_DB: book_review
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d book_review"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend-tests:
    build:
      context: ./backend
    profiles:
      - test
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: pytest --cov=app --cov-report=term-missing --cov-report=xml:/app/coverage.xml --junitxml=/app/pytest-report.xml tests

  frontend:
    build:
      context: ./frontend
    ports:
      - '4200:4200'
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    command: npm run start -- --host 0.0.0.0 --poll=2000

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '9000:80'
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  frontend_node_modules:
