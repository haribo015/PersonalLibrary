<section class="screen auth-layout">
  <section class="auth-panel">
    <span class="hero-tag">Account</span>
    <h2>Inscription</h2>

    <form class="review-form" (submit)="$event.preventDefault(); register();">
      <div class="field-row">
        <label for="register_name">Nom</label>
        <input id="register_name" type="text" [(ngModel)]="name" name="name" required />
      </div>

      <div class="field-row">
        <label for="register_email">Email</label>
        <input id="register_email" type="email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="field-row">
        <label for="register_password">Mot de passe</label>
        <input id="register_password" type="password" [(ngModel)]="password" name="password" minlength="8" required />
        <span class="muted">Le mot de passe doit contenir au moins 8 caracteres.</span>
      </div>

      <button type="button" (click)="register()">Creer un compte</button>
      <p class="error" *ngIf="error">{{ error }}</p>
    </form>

    <div class="auth-switch">
      <span>Deja inscrit ?</span>
      <a routerLink="/login">Se connecter</a>
    </div>
  </section>
</section>
