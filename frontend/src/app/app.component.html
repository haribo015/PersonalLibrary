<div class="app-shell">
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div class="brand-copy">
          <h1>Bibliothèque personnelle</h1>
        </div>
      </div>

      <nav class="nav">
        <ng-container *ngIf="auth.isLoggedIn(); else guestNavigation">
          <a routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
          <a routerLink="/search" routerLinkActive="active-link">Explorer</a>
          <a routerLink="/library" routerLinkActive="active-link">Bibliotheque</a>
          <a routerLink="/recommendations" routerLinkActive="active-link">Suggestions</a>
          <button type="button" (click)="logout()">Deconnexion</button>
        </ng-container>

        <ng-template #guestNavigation>
          <a routerLink="/login" routerLinkActive="active-link">Connexion</a>
        </ng-template>
      </nav>
    </header>

    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
